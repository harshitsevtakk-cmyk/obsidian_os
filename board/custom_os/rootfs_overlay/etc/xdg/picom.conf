#################################
#    SHUM OS - macOS Animations  #
#################################

# Enable experimental animations backend
animations = true;
animation-stiffness-in-tag = 125;
animation-stiffness-tag-change = 90.0;
animation-window-mass = 0.4;
animation-dampening = 15;
animation-clipping = false;

# Window open/close animation rules (macOS zoom & fade)
animation-for-open-window = "zoom";
animation-for-unmap-window = "zoom";
animation-for-transient-window = "slide-up";

# Smooth fading transitions
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 3;

#################################
#     macOS Rounded Corners     #
#################################

corner-radius = 14;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#################################
#    Frosted Glass & Opacity    #
#################################

active-opacity = 0.94;
inactive-opacity = 0.88;
frame-opacity = 1.0;
inactive-opacity-override = false;

# Dual-Kawase method gives genuine macOS blur
blur-method = "dual_kawase";
blur-strength = 7;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#      macOS Soft Shadows       #
#################################

shadow = true;
shadow-radius = 20;
shadow-opacity = 0.35;
shadow-offset-x = -18;
shadow-offset-y = -18;
shadow-color = "#000000";

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#       Backend & Render        #
#################################

backend = "glx";
vsync = true;
mark-wmwin-focused = true;
mark-ovred-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
use-damage = true;
