name: Build Shum OS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to trigger builds manually from GitHub

jobs:
  build-shum-os:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Buildroot Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses5-dev \
            libssl-dev \
            bc \
            rsync \
            unzip \
            wget \
            cpio \
            python3 \
            file \
            git

      - name: Setup Buildroot Ccache & Download Cache
        uses: actions/cache@v4
        with:
          path: |
            dl
            /home/runner/.buildroot-ccache
          key: buildroot-${{ runner.os }}-${{ hashFiles('my_os.config') }}
          restore-keys: |
            buildroot-${{ runner.os }}-

      - name: Configure Ccache Environment
        run: |
          mkdir -p /home/runner/.buildroot-ccache
          export CCACHE_DIR="/home/runner/.buildroot-ccache"
          ccache -M 2G || true

      - name: Initialize and Build Shum OS
        run: |
          # If using an external Buildroot tree, or cloning Buildroot directly:
          if [ ! -d "buildroot" ]; then
            git clone --depth 1 --branch 2024.02.x https://github.com/buildroot/buildroot.git
          fi
          
          # Copy your custom config into buildroot
          cp my_os.config buildroot/.config
          
          # Run the build
          cd buildroot
          make olddefconfig
          make
          
      - name: Locate and Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShumOS-ISO
          path: buildroot/output/images/*.iso
