name: Build Shum OS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-shum-os:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Buildroot Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses5-dev \
            libssl-dev \
            bc \
            rsync \
            unzip \
            wget \
            cpio \
            python3 \
            file \
            git

      - name: Cache Buildroot ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.buildroot-ccache
          key: buildroot-ccache-${{ runner.os }}-${{ hashFiles('my_os.config') }}
          restore-keys: |
            buildroot-ccache-${{ runner.os }}-

      - name: Configure Ccache
        run: |
          mkdir -p /home/runner/.buildroot-ccache
          export CCACHE_DIR="/home/runner/.buildroot-ccache"
          ccache -M 2G || true

      - name: Make scripts executable
        run: |
          chmod +x rootfs_overlay/etc/init.d/S99installer || true
          chmod +x rootfs_overlay/usr/bin/shum-installer || true

      - name: Build Shum OS Image (Parallel)
        run: |
          if [ ! -d "buildroot" ]; then
            git clone --depth 1 --branch 2024.02.x https://github.com/buildroot/buildroot.git
          fi
          
          # Copy board configuration and rootfs overlay inside buildroot
          cp -r board buildroot/
          cp -r rootfs_overlay buildroot/
          
          cp my_os.config buildroot/.config
          cd buildroot
          make olddefconfig
          make -j$(nproc)

      - name: Upload Single ShumOS Installer ISO
        uses: actions/upload-artifact@v4
        with:
          name: ShumOS-Installer-ISO
          path: buildroot/output/images/rootfs.iso9660
