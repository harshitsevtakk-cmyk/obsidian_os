name: Build Shum OS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-os:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Buildroot Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses-dev bison flex libssl-dev \
            bc rsync gawk wget git unzip libelf-dev python3 python3-pip

      - name: Download Buildroot
        run: |
          wget https://buildroot.org/downloads/buildroot-2024.02.1.tar.gz
          tar -xzf buildroot-2024.02.1.tar.gz
          mv buildroot-2024.02.1 buildroot

      - name: Copy Config & Board Customizations
        run: |
          cp my_os.config buildroot/.config
          mkdir -p buildroot/board/custom_os
          cp -r board/custom_os/* buildroot/board/custom_os/

      - name: Compile Shum OS Image
        working-directory: ./buildroot
        run: |
          make olddefconfig
          make -j$(nproc)

      - name: Upload Finished OS Image
        uses: actions/upload-artifact@v4
        with:
          name: Shum-OS-x86_64-Image
          path: buildroot/output/images/
